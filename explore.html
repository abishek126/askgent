<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Science | Askgent</title><meta name="description" content="Search and filter visual science discoveries."><meta property="og:type" content="website"><meta property="og:title" content="Explore Science | Askgent"><meta property="og:description" content="Search and filter visual science discoveries."><meta property="og:image" content="assets/images/og/og-default.svg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="assets/icons/favicon.svg"><link rel="stylesheet" href="css/global.css"></head><body><div id="siteHeader"></div><main class="section"><div class="container"><span class="kicker">EXPLORE</span><h1>Discover science.</h1><p class="muted">Search, filter and browse the visual library.</p><div class="filter-bar"><div class="search"><span>⌕</span><input id="search" placeholder="Search discoveries..."></div><span id="count" class="muted"></span></div><div class="filters"><select id="cat"><option value="all">All categories</option><option value="space">Space &amp; Astronomy</option><option value="physics">Physics</option><option value="biology">Biology</option><option value="human-body">Human Body</option><option value="chemistry">Chemistry</option><option value="earth">Earth Science</option><option value="animals">Animals</option><option value="nature">Nature</option><option value="technology">Technology</option><option value="scientists">Scientists</option></select><select id="kind"><option value="all">All content</option><option value="trending">Trending</option><option value="featured">Featured</option></select><select id="sort"><option value="newest">Newest</option><option value="popular">Most liked</option><option value="views">Most viewed</option></select></div><div id="grid" class="grid article-grid"></div></div></main><div id="siteFooter"></div><script src="data/categories.js"></script><script src="data/articles.js"></script><script src="data/facts.js"></script><script src="data/scientists.js"></script><script src="js/components.js"></script><script src="js/favorites.js"></script><script src="js/search.js"></script><script src="js/articles.js"></script><script src="js/categories.js"></script><script src="js/scientists.js"></script><script src="js/facts.js"></script><script src="js/utils.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let run=()=>{let a=searchArticles($("#search").value);if($("#cat").value!=="all")a=a.filter(x=>x.category===$("#cat").value);if($("#kind").value==="trending")a=a.filter(x=>x.trending);if($("#kind").value==="featured")a=a.filter(x=>x.featured);if($("#sort").value==="popular")a.sort((x,y)=>y.likes-x.likes);if($("#sort").value==="views")a.sort((x,y)=>y.views-x.views);if($("#sort").value==="newest")a.sort((x,y)=>y.createdAt.localeCompare(x.createdAt));$("#count").textContent=a.length+" discoveries";renderArticles($("#grid"),a)};["search","cat","kind","sort"].forEach(id=>$("#"+id).addEventListener("input",run));let q=new URLSearchParams(location.search).get("q");if(q)$("#search").value=q;run()})</script></body></html>
