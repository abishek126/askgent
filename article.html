<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Discovery | Askgent</title><meta name="description" content="Read a visual science discovery."><meta property="og:type" content="website"><meta property="og:title" content="Science Discovery | Askgent"><meta property="og:description" content="Read a visual science discovery."><meta property="og:image" content="assets/images/og/og-default.svg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="assets/icons/favicon.svg"><link rel="stylesheet" href="css/global.css"></head><body><div id="siteHeader"></div><main class="article-page"><div class="container" id="host"></div></main><div id="siteFooter"></div><script src="data/categories.js"></script><script src="data/articles.js"></script><script src="data/facts.js"></script><script src="data/scientists.js"></script><script src="js/components.js"></script><script src="js/favorites.js"></script><script src="js/search.js"></script><script src="js/articles.js"></script><script src="js/categories.js"></script><script src="js/scientists.js"></script><script src="js/facts.js"></script><script src="js/utils.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let a=getArticle(new URLSearchParams(location.search).get("id"));if(!a){$("#host").innerHTML="<div class=empty><h2>Discovery not found</h2><a class=btn href=explore.html>Explore science</a></div>";return}document.title=a.title+" | Askgent";$("#host").innerHTML=`<div class="article-layout"><article><div class="chips"><span class="chip">${escapeHTML(categoryName(a.category))}</span><span class="chip">${a.type}</span>${a.trending?'<span class="chip">🔥 Trending</span>':''}</div><h1>${escapeHTML(a.title)}</h1><p class="muted" style="font-size:20px">${escapeHTML(a.description)}</p><img class="article-hero" src="${a.image}" alt="${escapeHTML(a.title)}"><div class="meta"><span>${a.readTime} min read · ${a.views.toLocaleString()} views</span><span><button class="btn" id="save">${isSaved(a.id)?"♥ Saved":"♡ Save"}</button> <button class="btn" id="share">Share</button></span></div><div class="article-content"><p>${escapeHTML(a.body)}</p><h2>The key idea</h2><p>${escapeHTML(a.description)}</p><div class="callout"><strong>Science note</strong><br>Use the listed source as a starting point for deeper reading and verify fast-changing claims against authoritative material.</div><h2>Related discoveries</h2><div id="related" class="grid article-grid"></div></div></article><aside class="sidebar"><div class="card"><div class="card-body"><span class="kicker">SOURCE</span><h3>${escapeHTML(a.source)}</h3><div class="chips">${a.tags.map(t=>'<span class="chip">'+escapeHTML(t)+'</span>').join("")}</div><button class="btn primary" id="preview">Preview text</button></div></div></aside></div>`;$("#save").onclick=()=>$("#save").textContent=toggleSaved(a.id)?"♥ Saved":"♡ Save";$("#share").onclick=()=>shareUrl(a.title,location.href);renderArticles($("#related"),SCIENCE_ARTICLES.filter(x=>x.category===a.category&&x.id!==a.id).slice(0,3));$("#preview").onclick=()=>{let bg=document.createElement("div");bg.className="modal-bg open";bg.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><strong>'+escapeHTML(a.title)+'</strong><button class="btn icon" id="close">×</button></div><div class="modal-body"><div class="prompt-box">'+escapeHTML(a.body)+'</div><button class="btn accent" id="copy" style="margin-top:14px">Copy text</button></div></div>';document.body.append(bg);$("#close",bg).onclick=()=>bg.remove();bg.onclick=e=>{if(e.target===bg)bg.remove()};$("#copy",bg).onclick=()=>copyText(a.body);document.onkeydown=e=>{if(e.key==="Escape")bg.remove()}}})</script></body></html>
