<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contribute Knowledge | Askgent</title><meta name="description" content="Submit a science discovery for review."><meta property="og:type" content="website"><meta property="og:title" content="Contribute Knowledge | Askgent"><meta property="og:description" content="Submit a science discovery for review."><meta property="og:image" content="assets/images/og/og-default.svg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="assets/icons/favicon.svg"><link rel="stylesheet" href="css/global.css"></head><body><div id="siteHeader"></div><main class="section"><div class="container"><span class="kicker">CONTRIBUTE</span><h1>Share something worth knowing.</h1><p class="muted">Static mode stores submissions locally. Connect Supabase for a real editorial workflow.</p><form id="form" class="card form"><div class="form-grid"><div class="field"><label>Title *</label><input id="title" required></div><div class="field"><label>Category *</label><select id="cat" required><option value="">Choose</option><option value="space">Space &amp; Astronomy</option><option value="physics">Physics</option><option value="biology">Biology</option><option value="human-body">Human Body</option><option value="chemistry">Chemistry</option><option value="earth">Earth Science</option><option value="animals">Animals</option><option value="nature">Nature</option><option value="technology">Technology</option><option value="scientists">Scientists</option></select></div><div class="field full"><label>Description *</label><textarea id="desc" rows="3" required></textarea></div><div class="field full"><label>Knowledge / explanation *</label><textarea id="body" rows="10" required></textarea></div><div class="field"><label>Source</label><input id="source"></div><div class="field"><label>Author name</label><input id="author"></div></div><button class="btn accent" style="margin-top:20px">Submit for review</button><p id="msg" class="muted"></p></form></div></main><div id="siteFooter"></div><script src="data/categories.js"></script><script src="data/articles.js"></script><script src="data/facts.js"></script><script src="data/scientists.js"></script><script src="js/components.js"></script><script src="js/favorites.js"></script><script src="js/search.js"></script><script src="js/articles.js"></script><script src="js/categories.js"></script><script src="js/scientists.js"></script><script src="js/facts.js"></script><script src="js/utils.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>$("#form").onsubmit=e=>{e.preventDefault();let x=JSON.parse(localStorage.getItem("askgent-submissions")||"[]");x.push({id:"sub-"+Date.now(),title:$("#title").value,category:$("#cat").value,description:$("#desc").value,body:$("#body").value,source:$("#source").value,author:$("#author").value,status:"pending",createdAt:new Date().toISOString()});localStorage.setItem("askgent-submissions",JSON.stringify(x));e.target.reset();$("#msg").textContent="Submission received and saved locally for review.";toast("Submission received")})</script></body></html>
