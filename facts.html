<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Science Facts | Askgent</title><meta name="description" content="Fast visual science facts."><meta property="og:type" content="website"><meta property="og:title" content="Quick Science Facts | Askgent"><meta property="og:description" content="Fast visual science facts."><meta property="og:image" content="assets/images/og/og-default.svg"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="assets/icons/favicon.svg"><link rel="stylesheet" href="css/global.css"></head><body><div id="siteHeader"></div><main class="section"><div class="container"><span class="kicker">QUICK FACTS</span><h1>Small facts. Big curiosity.</h1><p class="muted">Fast science facts for when you want to learn something in a minute.</p><div class="filters" style="margin-top:25px"><select id="filter"><option value="all">All categories</option><option value="space">Space &amp; Astronomy</option><option value="physics">Physics</option><option value="biology">Biology</option><option value="human-body">Human Body</option><option value="chemistry">Chemistry</option><option value="earth">Earth Science</option><option value="animals">Animals</option><option value="nature">Nature</option><option value="technology">Technology</option><option value="scientists">Scientists</option></select><button id="random" class="btn accent">Surprise me</button></div><div id="grid" class="grid fact-grid"></div></div></main><div id="siteFooter"></div><script src="data/categories.js"></script><script src="data/articles.js"></script><script src="data/facts.js"></script><script src="data/scientists.js"></script><script src="js/components.js"></script><script src="js/favorites.js"></script><script src="js/search.js"></script><script src="js/articles.js"></script><script src="js/categories.js"></script><script src="js/scientists.js"></script><script src="js/facts.js"></script><script src="js/utils.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let draw=()=>{let c=$("#filter").value,a=c==="all"?SCIENCE_FACTS:SCIENCE_FACTS.filter(x=>x.category===c);$("#grid").innerHTML=a.map(f=>'<article class="card fact-card"><img loading="lazy" src="'+f.image+'" alt="Science fact illustration"><div class="card-body"><span class="chip">'+escapeHTML(categoryName(f.category))+'</span><h3>'+escapeHTML(f.fact)+'</h3><div class="meta"><span>Source: '+escapeHTML(f.source)+'</span><button class="btn" data-copy="'+encodeURIComponent(f.fact)+'">Copy</button></div></div></article>').join("")};draw();$("#filter").onchange=draw;$("#random").onclick=()=>copyText(SCIENCE_FACTS[Math.floor(Math.random()*SCIENCE_FACTS.length)].fact)})</script></body></html>
